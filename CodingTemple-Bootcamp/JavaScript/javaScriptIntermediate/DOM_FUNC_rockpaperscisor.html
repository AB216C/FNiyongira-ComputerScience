<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper and Scissors</title>
    <style>
    </style>
  </head>
  <body>

    <p>Rock Paper Scissor</p>

    <button onclick="

    covercomputerMove()

    let outcome=''

    if(computerMove==='Rock') {
      outcome='tie'
    }else if(computerMove==='Paper') {
      outcome='You lose'
    }else if(computerMove==='Scissor') {
      outcome='You win'
    }

    if(outcome=== 'You win') {
      score.wins +=1
    }else if(outcome=== 'You lose') {
      score.losses +=1
    }else if(outcome==='tie') {
      score.ties +=1
    }

    alert(`You picked Rock, computer picked ${computerMove}. The outcome:${outcome}. 
WinsUpdatedScore:${score.wins}, LossesUpdatedScore:${score.losses}, TiesUpdatedScore:${score.ties}
    `)

    ">Rock</button>

  
    <button onclick="

    covercomputerMove()

    let outcome=''

    if(computerMove==='Rock') {
      outcome='You win'
    }else if(computerMove==='Paper') {
      outcome='tie'
    }else if(computerMove==='Scissor') {
      outcome='You lose'
    }

    if(outcome=== 'You win') {
      score.wins +=1
    }else if(outcome=== 'You lose') {
      score.losses +=1
    }else if(outcome==='tie') {
      score.ties +=1
    }

    alert(`You picked paper, computer picked ${computerMove}. The outcome:${outcome}
WinsUpdatedScore:${score.wins}, LossesUpdatedScore:${score.losses}, TiesUpdatedScore:${score.ties}
    `)
    
    ">Paper</button>


    <button onclick="

    covercomputerMove()
    
    let outcome=''

    if(computerMove==='Rock') {
      outcome='You lose'
    }else if(computerMove==='Paper') {
      outcome='You win'
    }else if(computerMove==='Scissor') {
      outcome='tie'
    }


    if(outcome=== 'You win') {
      score.wins +=1
    }else if(outcome=== 'You lose') {
      score.losses +=1
    }else if(outcome==='tie') {
      score.ties +=1
    }

    alert(`You picked Scissor, computer picked ${computerMove}. The outcome:${outcome}
WinsUpdatedScore:${score.wins}, LossesUpdatedScore:${score.losses}, TiesUpdatedScore:${score.ties}
    `)
    
    ">Scissor</button>

    <button onclick="
      score.wins=0,
      score.losses=0,
      score.ties=0
    ">Reset Score</button>

    <script>
    
    /*variable let computerMove is outside the function*/
    
    let computerMove = ''

      function covercomputerMove() {
        
        const randomNumber = Math.random()

        if(randomNumber<1/3) {
          computerMove='Rock'
        }else if(randomNumber>=1/3 && randomNumber<2/3) {
          computerMove='Paper'
        }else if(randomNumber>=2/3) {
          computerMove='Scissor'
        }

        console.log(computerMove)
      }

      const score = {
      wins:0,
      losses:0,
      ties:0
    }

    localStorage.setItem('score',JSON.stringify(score))

    </script>
  </body>

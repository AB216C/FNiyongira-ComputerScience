<!DOCTYPE html>
<html>
  <head>
    <title>
      DOM projects
    </title>
    
  </head>
  

  <body>

    <p>Youtube Subscribe Buttons</p>

    <!-- Up on clicking the button, subscribe will change into subscribed -->

    <button onclick="
    subscribe()
    
    " class="sub-button" >Subscribe</button>

    <script>

      function subscribe() {
        const bElement = document.querySelector('.sub-button');

          if (bElement.innerHTML === 'Subscribe' ) {
            bElement.innerHTML ='Subscribed'
          }else {
            bElement.innerHTML='Subscribe'
          }
      }

    </script>
  </body>
</html>

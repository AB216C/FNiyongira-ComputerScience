<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Dynamic Data vs Hard-coded data
    1. Dynamic Data: Collect dynamic data from users and store it in database or backend 
    2. Hard-coded data: Values are directly written into the HTML or code and don't change based on user input.
     -->

    <form>
      <div class="mb-3">
        <label for="InputEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="InputEmail" aria-describedby="emailHelp">
        <div type="emailHelp" class="form-text" >We will not share your email to anyone</div>
      </div>

      <div class="mb-3">
       <label for="Inputpassword" class="form-label">Password</label>
       <input type="password" class="form-control" id="Inputpassword">
      </div>


      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="Check1" >
        <label for="Check1" class="form-check-label">checkout</label>
      </div>
      <button type="button" class="btn btn-primary">
        Submit
      </button>
    </form>




    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <p class="bg-success text-light text-uppercase py-4 px-5 fw-bolder fs-1">Image Styling</p>
      <!-- place navbar here -->
    </header>
    <main>
      <!-- RESPONSIVE IMAGES WITH IMAGE FLUID 
      
      -->
<!-- 
      img (
        max-width:100%;
        height:auto
       ) -->

      <!-- FLUID IMAGE IN A FIXED WIDTH CONTAINER
       Even if the parent container has a fixed width, the image will adjust to fit within it -->

      <div class="container" style="width:400px;border:1px solid black">
        <img src="pictures/car.webp" class="img-fluid" alt="responsive image">
      </div>

      <div class="container" style="width:400px;border:1px solid black">
        <img src="pictures/car.webp" class="img-fluid rounded-circle" alt="circular image">
      </div>

      <div class="container" style="width:400px;border:1px solid black">
        <img src="pictures/car.webp" class="img-fluid rounded" alt="rounded image">
      </div>

      
    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

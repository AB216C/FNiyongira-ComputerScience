<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>


    <!-- The invalid-feedback and valid-feedback classes display messages below inputs.

invalid-feedback provides error messages, like "Please enter a valid email."
valid-feedback confirms valid input, with messages such as "Looks good!" -->

    <form class="needs-validation mb-5" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control is-invalid" id="email" required>
        <div class="invalid-feedback">
          Please enter a valid email.
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>


    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="text" class="form-control is-invalid" id="email"required>
        <div class="invalid-feedback">Please enter valid email</div>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>


    <form class="needs-validation mb-3" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="text" class="form-control is-valid" id="email"required>
        <div class="invalid-feedback">Please enter valid email</div>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>

    <h1>NEXT PART</h1>


    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control is-invalid" id="email" required>
        <div class="invalid-feedback">
          Please enter a valid email address.
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
        <div class="invalid-feedback">
          Password is required.
        </div>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="terms" required>
        <label class="form-check-label" for="terms">Accept terms and conditions</label>
        <div class="invalid-feedback">
          You must accept the terms and conditions.
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

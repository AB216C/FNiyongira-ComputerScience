<!-- HTML FORMS 
HTML forms are used to collect input from users. This input can be processed or submitted to a web server. The basic structure of a form includes input fields like text boxes, radio buttons, checkboxes, and submit buttons. 
-->

<form action="/submit" method="POST">
  <!-- Form elements go here 
  
<form>: Defines the form itself.
action: Specifies where the form data should be sent when submitted.
method: Defines the HTTP method to use when sending form data (GET or POST).
  -->
</form>

<!-- 
🚀 Common Form Elements
Forms contain different types of input fields that allow users to enter data.

 For the common elements below, try following along! Don't forget to insert the form elements inside a form element.  -->

 <form action="/submit" method="POST">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Enter your name:">
 </form>
<hr>
 <!-- 
 <label>: Describes the input field.
  <input type="text">: Creates a text input field.
  id and name: Used to identify and refer to the input field.
  placeholder: Provides a hint to the user about what to enter. 
  -->

<!-- Radio buttons -->
<p>Gender:</p>
<div>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male" style="margin-right: 20px;">Male</label>

      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label>
</div>
<hr/>
<!-- Password field -->

<div>
  <label for="Password" >Password</label>
  <input type="password" id="password" name="password" value="password">
</div>

<!-- checkboxes -->
<hr/>
<p>Hobbies:</p>
<div>
  <input type="checkbox" id="Reading" name="Reading" value="Reading">
  <label for="Reading">Reading</label>

  <input type="checkbox" id="Dancing" name="Dancing" value="Dancing">
  <label for="Dancing">Dancing</label>

  <input type="checkbox" id="Marathon" name="Maarathon" value="Marathon">
  <label for="Marathon">Marathon</label>
</div>

<!-- Drop down list-Select Boxes -->
<hr/>
<label for="Country">Country:</label>
<select id="Country" name="Country">
  <option value="Uganda">Uganda</option>
  <option value="Zambia">Zambia</option>
  <option value="Zanzibar">United States</option>
</select>

<!-- Text Area -->
<hr/>

<label>Comments:</label>
<textarea id="comments" name="comments" rows="4" cols="10"></textarea>


<hr/>
<!-- Submit button -->


<p>Submit button:</p>

<input style="height:40px;width:200px" type="submit">

<!-- Email field -->

<p>Email field:</p>

<label for="Email">Email</label>
<input type="email" name="email" id="email" placeholder="Enter your email">

<!-- Number Field -->

<p>Number field</p>

<label for="quantity">Quantity:</label>
<input type="number" name="number" id="number" min="-10" max="10" step="3">

<!-- min and max: Set the minimum and maximum values the user can enter.
step: Defines the increments allowed when increasing or decreasing the value. -->

<p>Date Field</p>

<h2>Unselected and Selected States</h2>
<label for="data">Birthdate:</label>
<input type="date">

<!-- HTML form attributes -->

<!-- 1. required Attribute: Makes an input mandatory. -->
<p>Required</p>
<input type="text"required>

<!-- 2. placeholder Attribute: Provides a hint to the user inside the input field -->
<p>Placeholder</p>
<input type="text" placeholder="Enter your name">
<!-- 3. disabled Attribute: Disables an input field, preventing user interaction. -->
<p>disabled</p>
<input type="text"disabled>
<!-- 4. value Attribute: Sets a default value for the input field. -->
<p>value</p>
<input type="text" value="2345">

<!-- Best Practices for HTML Forms -->


<!-- 5. Implement Error Handling and Validation

Use HTML5 validation attributes like required and pattern and provide clear error messages to guide users when corrections are needed. -->

<input type="email" id="user-email" name="user-email" required>
<div role="alert" aria-live="assertive">Please enter a valid email address.</div>


<!-- 6. Group Related Fields

Use <fieldset> and <legend> to group related fields, especially in longer forms, to organize the form and make it easier to follow. -->

<fieldset>
    <legend>Contact Information</legend>
    <!-- Contact information fields go here -->
</fieldset>

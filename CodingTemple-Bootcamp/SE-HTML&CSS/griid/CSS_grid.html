<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="CSS_grid.css" >
</head>
<body>
  <!-- CSS Grid is a powerful two-dimensional layout system that allows you to create complex and responsive grid-based layouts with ease.
Unlike Flexbox, which is designed for one-dimensional layouts (rows or columns), Grid gives you control over both rows and columns simultaneously,
making it ideal for laying out web pages, designing interfaces, or organizing content in more structured ways. -->

  <div class="grid-container">
    <div class="item1">Item 1</div>
    <div class="item2">Item 2</div>
    <div class="item3">Item 3</div>
    <div class="item4">Item 4</div>
  </div>
  
</body>

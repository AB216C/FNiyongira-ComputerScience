<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<style>
    body {
            background-color: black;
          }

    .squared {
      height:50px;
      width:50px;
      border: 6px solid aqua;
      box-shadow: 0 0 8px aqua, aqua inset;
      border-radius: 2px;
      display:flex;
      position:absolute;
      top:50%;
      left:50%;
      translate: -50% -50%;    
      z-index:10px;
      animation: 2s animation ease-in-out infinite;
    }

    @keyframes animation{
      0%{
        transform: rotateX(0) rotateY(0) rotateZ(0);

      }

      33% {
        transform: rotateX(180deg) rotateY(0) rotateZ(0);

      }

      67% {
        transform: rotateX(180deg) rotateY(180deg) rotateZ(0);

      }

      100%{
        transform: rotateX(180deg) rotateY(180deg) rotateZ(180deg);

      }

    }

</style>

</head>


<body>

  <div class="squared"></div>
  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>

    .custom-text-shadow {
      font-size: 60px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3) ;
      margin-right:350px;
    }

    button {

      background-color:rgb(33, 95, 157);
      color:white;
      padding:15px 25px 15px 25px;
      border-radius:20px;
      border: 5px solid black;

    }

    button:hover {
      background-color: green;
      cursor:pointer;
    }

  </style>
</head>
<body>

   
<!-- 
🖼️ Shadows and Text Effects -->


  <h1 class="custom-text-shadow">Text with Shadow</h1>


  <!-- 💥CSS Transitions -->

  <button>CLICK ME</button>


</body>
</html>

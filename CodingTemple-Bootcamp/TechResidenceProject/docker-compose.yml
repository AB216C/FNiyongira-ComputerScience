
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_elre_db
    env_file:
      - ./Backend/app/db/.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # All *.sql inside initdb/ will run automatically on first boot
      - ./Backend/app/db/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-elre}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Keep simple for now; move to an API .env later if you want
      DATABASE_URL: postgresql://postgres:postgres@db:5432/elre
    ports:
      - "5500:5500"


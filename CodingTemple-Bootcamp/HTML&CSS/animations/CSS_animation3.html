<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
      .temple {
      background-color:green;
      font-size: 2rem;
      width:300px;
      height:300px;
      display:flex;
      justify-content:center;
      align-items: center;
      margin-left:25%;
      margin-top:25%;
      animation-duration:3s;
      animation-name:spin;
      animation-timing-function:ease-in-out;
      animation-delay:0.5s;
      animation-iteration-count: infinite;
      /* animation-iteration-count:infinite; For infinite, it run on while loop non stop */
      /* animation-direction:reverse; */
      /* animation-direction:alternate; */
      animation-direction:normal;
      animation-fill-mode: forwards;
      animation-play-state: running;

      /* animation:3s spin ease-in-out 0.5s infinite alternate; Just in one line of animation */
    }

    .temple:hover {
      animation-play-state: paused;
    }
/* 
    This example fades the element in over 3 seconds. */

  @keyframes spin{
    0% {

    }

    50% {
      scale:2;
      transform:rotate(0);
      border-radius:0;
    }

    100%{

      transform:rotate(360deg);
      border-radius:50%;
      scale:2;

    }
  }

  </style>
</head>
<body>

  <div class="temple">
    <p>Coding Temple</p>
  </div>
  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>

    @keyframes fadeln{
      0% {
        opacity:0;
      }

      100% {
        opacity:1;
      }
    } 

    .element {
      animation:fadeln 3s ease-in-out;
    }


  </style>
</head>
<body>
  <div class="element">
    <h1>Element</h1>
  </div>


</body>
</html>

  <style>

    .container {
      display: flex;
    }
    .box {
      background-color: lightblue;
      padding: 20px;
      margin: 10px;
    }

    .container {
    display: flex;
    justify-content: center; /* Align items in the center */
   }

    .container {
    display: flex;
    align-items: center; /* Align items vertically in the center */
   }

    .container {
    display: flex;
    flex-direction: column; /* Stacks items vertically */
  }



  </style>
</head>
<body>

  <p>CSS Flexbox</p>

  <!-- Flexbox, or the Flexible Box Layout, is a CSS module designed to help arrange elements in a one-dimensional layout, either in a row (horizontally) or a column (vertically). 
  It simplifies the process of aligning and distributing space among items within a container, even when their sizes are unknown or dynamic. 
  In Flexbox, there are two key components: the flex container and the flex items. 

  The container uses properties like justify-content to control horizontal alignment, align-items for vertical alignment, and flex-wrap to handle wrapping behavior. 
  Items inside the container can be controlled with properties like flex-grow, flex-shrink, and flex-basis to manage their size and spacing in relation to other items.
    -->
<img src="pictures/flex image.png">

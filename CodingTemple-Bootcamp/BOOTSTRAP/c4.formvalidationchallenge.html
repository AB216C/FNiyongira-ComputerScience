<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>

    <form style="margin-left:10px">

      <div class="d-flex">
        <div class="mb-2">
          <label for="first name" class="form-label ms-1">First name</label>
          <input type="text" class="form-control" id="firstname"required >
          <div class="invalid-feedback">Last name is required</div>
        </div>

        <div>
          <label for="last name" class="form-label ms-3"  >Last name</label>
          <input type="text" class="form-control ms-3" id="lastname"required>
          <div class="invalid-feedback">Last name is required</div>
        </div>
      </div>

      <div>
        <label class="form-label">Email</label>
        <input type="email" class="form-control is-invalid" id="email"required>
        <div class="invalid-feedback">Please enter valid email</div>

      <div>
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password"required>
        <div class="invalid-feedback">Password is required</div>
      </div>

      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="terms" required>
        <label class="form-check-label">Accept terms and conditions</label>
        <div class="invalid-feedback">Please accept conditions outlined above</div>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>

    <!-- INPUT GROUP: They easily extend form control by adding text, buttons, and button groups on either side of the textual inputs, custom selects,  and custom file inputs.
     -->

     <div class="input-group mb-4">
      <span class="input-group-text" id="basic-addon1">@</span>
      <input type="text" class="form-control" placeholder="Username" arialabel="Username" aria-describedby="basic-addon1">
     </div>

     <div class="input-group mb-4">
      <input type="text" class="form-control" placeholder="Recipient's username" arialabel="Recipient's username" aria-describedby="basic-addon2">
      <span class="input-group-text" id="basic-addon2">@example.com</span>
     </div>

     <div>
      <label>Your Vanity URL</label>
      <div class="input-group mb-2">
        <span class="input-group-text" id="basic-addon3">https://example.com/users/</span>
        <input type="text" class="form-control" arialabel="">
      </div>
      <div class="form-text" id="basic-addon3">You can add extra information right here so called example help</div>
     </div>

     <div class="input-group mb-3">
      <span class="input-group-text">$</span>
      <input class="form-control" type="text" aria-label="amount in dallars">
      <span class="input-group-text">.00</span>
     </div>


     <div class="input-group mb-2">
      <input type="text" placeholder="username" aria-label="username" class="form-control">
      <span class="input-group-text">@</span>
      <input type="text" placeholder="server" class="form-control" aria-label="server">
     </div>

     <div class="input-group">
      <span class="input-group-text">With Textarea</span>
      <textarea class="form-control" aria-label="with Textarea"></textarea>
     </div>





    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
